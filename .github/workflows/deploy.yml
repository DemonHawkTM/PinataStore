name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build project
        run: npm run build

      - name: Generate static entrypoints for 200 OK deep links
        run: |
          mkdir -p dist/shop dist/customize dist/contact dist/track dist/cart dist/checkout dist/wishlist
          cp dist/index.html dist/shop/index.html
          cp dist/index.html dist/customize/index.html
          cp dist/index.html dist/contact/index.html
          cp dist/index.html dist/track/index.html
          cp dist/index.html dist/cart/index.html
          cp dist/index.html dist/checkout/index.html
          cp dist/index.html dist/wishlist/index.html
          cp dist/index.html dist/shop.html
          cp dist/index.html dist/customize.html
          cp dist/index.html dist/contact.html
          cp dist/index.html dist/track.html
          cp dist/index.html dist/cart.html
          cp dist/index.html dist/checkout.html
          cp dist/index.html dist/wishlist.html

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
