<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Pinata Shop Lahore</title>
    <script>
      // Single Page Application redirect for GitHub Pages
      // Keeps direct URLs like /admin and /track working seamlessly
      var segment = window.location.pathname.replace(/^\/PinataStore\/?/, '').replace(/^\//, '');
      var target = '/PinataStore/' + (segment ? '#' + segment : '') + window.location.search;
      window.location.replace(target);
    </script>
  </head>
  <body>
    <p>Redirecting to Pinata Shop Lahore...</p>
  </body>
</html>
